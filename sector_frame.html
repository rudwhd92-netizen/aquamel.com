<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>섹터 상황판 — 목업 v3 (사진 레이아웃)</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<style>
  :root{--accent:#569cd6;--accent2:#4ec9b0;--up:#fa5252;--down:#339af0;
    --bg:#1e1e1e;--panel:#252526;--panel-hi:#2d2d30;
    --p1:#2d2d30;--p2:#252526;--line:rgba(255,255,255,.05);--mute:#6a6a6a;--dim:#9d9d9d}
  *{margin:0;padding:0;box-sizing:border-box}
  body{font-family:'Pretendard Variable',Pretendard,-apple-system,system-ui,sans-serif;
    background:radial-gradient(1100px 620px at 50% 12%,rgba(86,156,214,.06),transparent 60%),#1e1e1e;
    color:#d4d4d4;min-height:100vh;padding:14px 14px;-webkit-font-smoothing:antialiased;font-size:12px;max-width:840px;margin:0 auto}
  .mono{font-family:Consolas,monospace}.up{color:var(--up)}.down{color:var(--down)}
  .head{display:flex;justify-content:flex-end;align-items:center;margin-bottom:8px;padding:0 4px}
  .head .t{font-size:17px;font-weight:800;letter-spacing:1.5px}
  .head .t b{background:linear-gradient(90deg,var(--accent),var(--accent2));-webkit-background-clip:text;background-clip:text;color:transparent}
  .head .clock{font-size:13px;color:var(--accent2);font-weight:700}
  .hctrl{display:flex;align-items:center;gap:16px}
  .psel{font-size:11px;color:var(--dim);font-weight:700;display:flex;align-items:center;gap:7px}
  .psel select{font:inherit;font-size:11.5px;font-weight:700;color:#d4d4d4;background:linear-gradient(180deg,var(--p1),var(--p2));
    border:1px solid var(--line);border-radius:8px;padding:5px 9px;cursor:pointer;outline:none}
  .panel{background:linear-gradient(180deg,var(--p1),var(--p2));border:1px solid var(--line);border-radius:10px;padding:8px 10px}
  .panel h3{font-size:10.5px;font-weight:700;color:#aebfda;margin-bottom:6px;display:flex;align-items:center;gap:5px}
  .panel h3 .dot{width:6px;height:6px;border-radius:50%;background:rgb(var(--ac))}
  .panel h3 .pg{margin-left:auto;font-size:9px;color:var(--mute);font-weight:600}

  .board{display:grid;grid-template-columns:230px 1fr 230px;gap:9px;max-width:1420px;margin:0 auto;align-items:start}
  .col{display:flex;flex-direction:column;gap:9px}

  /* 좌측 라인 패널 */
  .lp .ttl{font-size:10px;font-weight:700;color:#d4d4d4;margin-bottom:3px;display:flex;justify-content:space-between}
  .lp svg{width:100%;height:38px;display:block}
  .dots{display:flex;gap:4px;justify-content:center;margin-top:4px}
  .dots i{width:5px;height:5px;border-radius:50%;background:rgba(255,255,255,.18)}.dots i.on{background:var(--accent)}

  /* 상단 외부 타일 캐러셀 */
  .tiles{display:flex;align-items:center;justify-content:center;margin-bottom:2px}
  .tiles .strip{display:flex;justify-content:center;gap:30px}
  .tile{cursor:pointer;text-align:center;transition:.15s;padding:2px 6px;width:118px}
  .tile:hover{transform:translateY(-2px)}
  .tile .ti{color:rgb(var(--tc));filter:drop-shadow(0 0 8px rgba(var(--tc),.5));display:flex;justify-content:center}
  .tile .ti svg{width:28px;height:28px}
  .tile.on .ti{filter:drop-shadow(0 0 14px rgba(var(--tc),.95))}.tile.on .ti svg{width:36px;height:36px}
  .tile .nm{font-size:13px;font-weight:800;margin-top:5px;color:#f0f0f0;text-shadow:0 1px 3px rgba(0,0,0,.8)}
  .tile.on .nm{color:rgb(var(--tc))}
  .tile .rr{font-size:12px;font-weight:800;margin-top:2px;text-shadow:0 1px 3px rgba(0,0,0,.8)}
  .tile .ww{font-size:10px;color:var(--dim)}
  .cbtn{width:26px;height:48px;border-radius:7px;background:rgba(20,28,48,.85);border:1px solid var(--line);color:#d4d4d4;cursor:pointer;font-size:15px}

  /* 중앙 스테이지(링) */
  .stage{position:relative;border:none;border-radius:0;height:372px;overflow:visible;perspective:1000px;
    background:radial-gradient(440px 230px at 50% 44%,rgba(150,120,201,.12),transparent 68%)}
  #ring{position:absolute;inset:0;z-index:10}
  /* 토성 고리 — rotateX 틸트 + 동심 밴드 + 글로우 */
  .saturn{position:absolute;left:50%;top:40%;transform:translate(-50%,-50%);transform-style:preserve-3d;z-index:1}
  .saturn .sr{position:absolute;left:50%;top:50%;border-radius:50%;transform:translate(-50%,-50%) rotateX(74deg)}
  .saturn .sr1{width:536px;height:536px;border:2px solid rgba(86,156,214,.45);box-shadow:0 0 28px rgba(86,156,214,.30),inset 0 0 44px rgba(86,156,214,.10)}
  .saturn .sr2{width:452px;height:452px;border:1px solid rgba(78,201,176,.30)}
  .saturn .sr3{width:616px;height:616px;border:1px solid rgba(86,156,214,.16)}
  .saturn .sdisc{position:absolute;left:50%;top:50%;width:520px;height:520px;border-radius:50%;transform:translate(-50%,-50%) rotateX(74deg);background:radial-gradient(circle,rgba(86,156,214,.10),transparent 60%)}
  /* 노드 = 박스 없는 엠블럼(번호 뱃지 + 텍스트) */
  .node{position:absolute;width:112px;margin-left:-56px;margin-top:-52px;text-align:center;cursor:pointer;will-change:left,top,transform}
  .node .badge{display:flex;justify-content:center;color:rgb(var(--ac));filter:drop-shadow(0 0 8px rgba(var(--ac),.5))}
  .node .n{font-size:14px;font-weight:800;margin-top:6px;color:#f0f0f0;text-shadow:0 1px 4px rgba(0,0,0,.85)}
  .node .r{font-size:12px;font-weight:800;text-shadow:0 1px 3px rgba(0,0,0,.85)}.node .w{font-size:10px;font-weight:700;color:var(--dim)}
  .node.sel .badge{filter:drop-shadow(0 0 16px rgba(var(--ac),.95))}
  .node.sel .n{color:#fff;font-size:16px}
  /* 하단 주인공 띠 (노드와 겹치지 않음) */
  .herobar{position:absolute;left:0;right:0;bottom:0;z-index:70;padding:9px 13px;border-top:1px solid var(--line);
    background:linear-gradient(180deg,rgba(8,11,20,0),rgba(8,11,20,.9) 45%);display:flex;align-items:center;gap:12px;flex-wrap:wrap}
  .herobar .hn{font-size:14px;font-weight:800}
  .herobar .tf{display:flex;gap:6px}.herobar .tf span{font-size:10px;background:rgba(255,255,255,.05);border-radius:6px;padding:3px 7px}.herobar .tf b{font-weight:800}
  .herobar .secs{display:flex;flex-wrap:wrap;gap:5px;margin-left:auto;justify-content:flex-end;max-width:60%}
  .herobar .sec{font-size:10px;font-weight:600;padding:3px 8px;border-radius:7px;background:rgba(var(--ac),.16);color:#d4d4d4;cursor:help}
  .nav{position:absolute;top:40%;transform:translateY(-50%);width:32px;height:32px;border-radius:50%;z-index:80;background:rgba(20,28,48,.9);border:1px solid var(--line);color:#d4d4d4;font-size:16px;cursor:pointer}
  .nav.l{left:8px}.nav.r{right:8px}
  /* v5: 아이콘 + 중앙 허브 */
  .node .badge svg{width:40px;height:40px}
  .node.sel .badge svg{width:52px;height:52px}
  .tile .ti{display:inline-flex;align-items:center}.tile .ti svg{width:30px;height:30px}
  .hub{position:absolute;z-index:55;width:268px;transform:translate(-50%,-50%);text-align:center;pointer-events:auto}
  .hub .hi{margin:0 auto 2px;filter:drop-shadow(0 0 10px rgba(var(--ac),.6))}.hub .hi svg{width:28px;height:28px}
  .hub .hnm{font-size:18px;font-weight:800;text-shadow:0 1px 5px rgba(0,0,0,.85)}
  .hub .hmeta{font-size:12px;color:var(--dim);margin-top:5px}.hub .hmeta b{font-weight:800}
  .hub .hsecs{display:flex;flex-wrap:wrap;justify-content:center;gap:5px;margin-top:10px}
  .hub .hsec{font-size:12px;font-weight:700;padding:4px 10px;border-radius:8px;background:rgba(var(--ac),.22);color:#ffffff;border:1px solid rgba(var(--ac),.45);cursor:help}

  /* 바 리스트 */
  .brow{display:flex;align-items:center;gap:6px;margin:5px 0;font-size:10px}
  .brow .lab{width:54px;color:#d4d4d4;flex-shrink:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .brow .track{flex:1;height:8px;background:rgba(255,255,255,.06);border-radius:4px;overflow:hidden}.brow .fill{height:100%;border-radius:4px}
  .brow .pct{width:40px;text-align:right}
  /* 중앙 하단 3패널 */
  .midrow{display:grid;grid-template-columns:1fr 1.3fr 1fr;gap:9px}
  .sgrid{width:100%;border-collapse:collapse;font-size:9.5px}
  .sgrid th,.sgrid td{padding:3px 4px;text-align:center;border-bottom:1px solid rgba(255,255,255,.05)}
  .sgrid th{color:var(--mute);font-weight:700}
  .sgrid td.l{text-align:left;color:#d4d4d4}
  .sgrid .c0{color:#3a4660}.sgrid .c1{color:#74b3e6}.sgrid .c2{color:#c0a6e6;font-weight:700}.sgrid .c3{color:#ff8787;font-weight:800}
  /* 게이지 */
  .gauges{display:grid;grid-template-columns:1fr 1fr;gap:8px}
  .gauge{text-align:center}.gauge .lab{font-size:9.5px;color:var(--dim);margin-bottom:3px}
  .gauge .big{font-size:13px;font-weight:800}.gauge svg{width:54px;height:54px}
  /* 테이블 */
  table.evt{width:100%;border-collapse:collapse;font-size:10px}
  table.evt th,table.evt td{text-align:left;padding:5px 7px;border-bottom:1px solid rgba(255,255,255,.06)}
  table.evt th{color:var(--mute);font-weight:700;font-size:9.5px}
  .story{display:inline-block;width:7px;height:7px;border-radius:50%;background:linear-gradient(135deg,var(--accent),var(--accent2));box-shadow:0 0 5px rgba(78,201,176,.7)}
  .note{max-width:1420px;margin:9px auto 0;font-size:10.5px;color:var(--mute);text-align:center;line-height:1.6}.note b{color:#aebfda}
</style>
</head>
<body>
  <div class="head">
    <label class="psel">평균등락률
      <select id="period">
        <option value="1">1일</option><option value="5">5일</option>
        <option value="20" selected>20일</option><option value="60">60일</option><option value="120">120일</option>
      </select>
    </label>
  </div>

  <!-- 외부 5계열 타일 -->
  <div class="tiles"><div class="strip" id="dock"></div></div>
  <!-- 회전 링 + 중앙 허브 (V6 중앙부) -->
  <div class="stage">
    <div class="saturn"><div class="sr sr3"></div><div class="sr sr1"></div><div class="sr sr2"></div><div class="sdisc"></div></div>
    <div id="ring"></div>
    <div class="hub" id="hub"></div>
    <button class="nav l" id="prev">‹</button><button class="nav r" id="next">›</button>
  </div>

<script>
const CORE=[
 {n:'자원',e:'🧪',num:'①',c:'90,156,168',subs:[['화학소재','산업가스·세정·향료·특수화학'],['광물·금속','구리·금·은·희토류·철강'],['에너지자원','우라늄·리튬']]},
 {n:'전력',e:'☢️',num:'②',c:'111,177,181',subs:[['원자력','24시간 안정 전력'],['에너지생산','셰일·LNG'],['에너지인프라','파이프라인'],['신재생','태양광·인버터']]},
 {n:'반도체',e:'🧠',num:'③',c:'127,179,181',subs:[['AI반도체','학습·추론 칩·파운드리'],['메모리','HBM·DRAM·NAND'],['센서','아날로그·MCU·전력'],['광통신','광 트랜시버·광섬유'],['반도체장비','EUV·식각·증착'],['반도체소재','가스·화학·마스크']]},
 {n:'데이터센터',e:'🏢',num:'④',c:'150,120,201',subs:[['DC장비','스위치·서버·전력·냉각'],['DC시공','건설 EPC'],['전력인프라','전력망·시공']]},
 {n:'모델',e:'✨',num:'⑤',c:'214,169,133',subs:[['빅테크','OS·검색·클라우드 메가캡'],['AI신생','응용 AI 신생 베팅']]},
 {n:'SW',e:'💻',num:'⑥',c:'216,139,110',subs:[['소프트웨어','엔터프라이즈·수직 SaaS'],['사이버보안','클라우드·엔드포인트 보안']]},
 {n:'피지컬',e:'🚗',num:'⑦',c:'201,122,92',subs:[['자율주행','자율주행 SW·전장'],['로보틱스','휴머노이드·산업로봇'],['정밀농공업','자율 트랙터·정밀GPS'],['산업자동화','중장비·HVAC·수처리'],['피지컬AI인프라','눈·귀·위치 칩']]},
];
const EXT=[
 {n:'헬스케어',e:'🏥',c:'136,160,136',subs:[['의료기기','수술로봇·심혈관·CGM'],['제약바이오','GLP-1·mRNA·항암'],['헬스인프라','보험·진단·디지털헬스']]},
 {n:'방위·우주',e:'🛡️',c:'155,155,150',subs:[['우주통신','발사체·위성'],['무기제조','전차·미사일·F-35'],['차세대방산','드론·에어택시'],['방산인프라','엔진·전자·특수금속']]},
 {n:'금융',e:'💳',c:'160,149,142',subs:[['은행','메가뱅크'],['결제','결제 듀오폴리'],['자산운용','사모자본·디지털금융']]},
 {n:'농업·식품·유통',e:'🌾',c:'165,176,126',subs:[['농업','종자·비료·농기계'],['식품','가공·음료'],['유통','리테일·물류']]},
 {n:'기타',e:'📦',c:'155,150,140',subs:[['소비재','필수·임의소비재'],['산업재','기계·운송'],['기타','복합·지주']]},
];
const TK=['NVDA','TSM','AVGO','ASML','MU','VST','CEG','PWR','ANET','PLTR','NOW','CRWD','TSLA','ISRG','LLY','RTX'];
function seed(a,b){let x=Math.sin((a+1)*97.13+(b+3)*41.7)*43758.5;return x-Math.floor(x);}
const ret=(i,k)=>+(seed(i,k)*18-6).toFixed(1), wgt=i=>3+Math.round(seed(i,2)*22);
[...CORE,...EXT].forEach((L,i)=>{L.r1=ret(i,4);L.r5=ret(i,0);L.r20=ret(i,1);L.r60=ret(i,2);L.r120=ret(i,3);L.w=wgt(i);L.idx=i;});
let period='20';const pr=L=>L['r'+period];
const sgn=v=>v>=0?'up':'down', fmt=v=>(v>=0?'+':'')+v.toFixed(1)+'%';
// v5: 12계열 지정 아이콘 (라인 SVG)
const ICONS={
 '자원':'<path d="M9 3h6M10 3v6l-5 8.5A2 2 0 0 0 6.7 21h10.6a2 2 0 0 0 1.7-3.5L14 9V3"/>',
 '전력':'<path d="M13 2 4 14h6l-1 8 9-12h-6z"/>',
 '반도체':'<rect x="7" y="7" width="10" height="10" rx="1"/><path d="M10 7V4M14 7V4M10 20v-3M14 20v-3M7 10H4M7 14H4M20 10h-3M20 14h-3"/>',
 '데이터센터':'<rect x="4" y="4" width="16" height="6" rx="1"/><rect x="4" y="14" width="16" height="6" rx="1"/><path d="M7.5 7h.01M7.5 17h.01"/>',
 '모델':'<circle cx="12" cy="12" r="3"/><circle cx="5" cy="6" r="1.5"/><circle cx="19" cy="6" r="1.5"/><circle cx="5" cy="18" r="1.5"/><circle cx="19" cy="18" r="1.5"/><path d="M9.6 10.4 6.2 7.2M14.4 10.4l3.4-3.2M9.6 13.6l-3.4 3.2M14.4 13.6l3.4 3.2"/>',
 'SW':'<path d="M8 8l-4 4 4 4M16 8l4 4-4 4M13 5l-2 14"/>',
 '피지컬':'<rect x="6" y="9" width="12" height="9" rx="2"/><circle cx="12" cy="4.5" r="1.5"/><path d="M12 6v3M9.5 13h.01M14.5 13h.01M4 12v3M20 12v3"/>',
 '헬스케어':'<path d="M10 4h4v6h6v4h-6v6h-4v-6H4v-4h6z"/>',
 '방위·우주':'<path d="M12 3l8 3v6c0 5-3.5 8-8 9-4.5-1-8-4-8-9V6z"/>',
 '금융':'<rect x="3" y="6" width="18" height="12" rx="2"/><path d="M3 10h18M7 15h4"/>',
 '농업·식품·유통':'<path d="M11 20A7 7 0 0 1 4 13C4 8 8 4 13 4c5 0 7 4 7 9a7 7 0 0 1-9 7M11 20c0-6 3-10 7-12"/>',
 '기타':'<path d="M21 8 12 3 3 8l9 5 9-5zM3 8v8l9 5 9-5V8M12 13v8"/>',
};
function icon(name,stroke){return `<svg viewBox="0 0 24 24" fill="none" stroke="${stroke||'currentColor'}" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">${ICONS[name]||''}</svg>`;}

// 외부 도크
const dock=document.getElementById('dock');
EXT.forEach((L,i)=>{const t=document.createElement('div');t.className='tile';t.style.setProperty('--tc',L.c);
  t.innerHTML=`<div class="ti">${icon(L.n)}</div><div class="nm">${L.n}</div><div class="rr"></div><div class="ww">비중 ${L.w}%</div>`;
  t.onclick=()=>{focus={type:'ext',i};render();};dock.appendChild(t);});

// 링(7 코어)
const ring=document.getElementById('ring');
CORE.forEach((L,i)=>{const d=document.createElement('div');d.className='node';d.style.setProperty('--ac',L.c);
  d.innerHTML=`<div class="badge">${icon(L.n,'rgb('+L.c+')')}</div><div class="n">${L.num} ${L.n}</div><div class="r"></div><div class="w">비중 ${L.w}%</div>`;
  d.onclick=()=>spinTo(i);ring.appendChild(d);});
const nodes=[...ring.children];let rot=0,focus={type:'core',i:0},ringIdx=0,selIdx=0;
const N=CORE.length, SPAN=270*Math.PI/180, GAP=SPAN/(N-1); // 내부 6칸 45°, 1↔7 사이는 90° 빈 공간
const base=i=>-SPAN/2 + i*GAP;            // node0(자원)=-135°, node6(피지컬)=+135°, 둘 사이 뒤쪽 90° 갭
const CX=()=>ring.clientWidth/2||380,CY=()=>(ring.clientHeight||372)*0.44,RX=()=>Math.min(300,(ring.clientWidth||760)/2-60),RY=92;
rot=-base(selIdx);
function place(){let best=-2,bi=0;nodes.forEach((nd,i)=>{const th=base(i)+rot,dep=Math.cos(th);
  nd.style.left=(CX()+RX()*Math.sin(th))+'px';nd.style.top=(CY()+dep*RY*0.9)+'px';
  const sc=.7+.3*((dep+1)/2);nd.style.transform=`scale(${sc.toFixed(3)})`;nd.style.opacity=(.66+.34*((dep+1)/2)).toFixed(2);
  nd.style.zIndex=Math.round((dep+1)*100)+10;if(dep>best){best=dep;bi=i;}});
  ringIdx=bi;nodes.forEach((nd,i)=>nd.classList.toggle('sel',i===bi&&focus.type==='core'));
  if(focus.type==='core')focus.i=bi;
  const hub=document.getElementById('hub');if(hub){hub.style.left=CX()+'px';hub.style.top=(CY()-22)+'px';}}
let anim;function spinTo(i){i=Math.max(0,Math.min(N-1,i));selIdx=i;const tg=-base(i),s=rot,t0=performance.now();
  cancelAnimationFrame(anim);
  (function st(t){const k=Math.min(1,(t-t0)/440),e=1-Math.pow(1-k,3);rot=s+(tg-s)*e;place();
    if(k<1)anim=requestAnimationFrame(st);else{focus={type:'core',i};render();}})(t0);}
document.getElementById('prev').onclick=()=>spinTo(selIdx-1);
document.getElementById('next').onclick=()=>spinTo(selIdx+1);
document.addEventListener('keydown',e=>{if(e.key==='ArrowLeft')spinTo(selIdx-1);if(e.key==='ArrowRight')spinTo(selIdx+1);});
document.getElementById('period').onchange=e=>{period=e.target.value;render();};

function bars(id,items){document.getElementById(id).innerHTML=items.map(it=>
 `<div class="brow"><span class="lab">${it.lab}</span><span class="track"><span class="fill" style="width:${it.v}%;background:${it.col}"></span></span><span class="pct mono ${it.cls||''}">${it.txt}</span></div>`).join('');}
function spark(i,k,col){const p=[];for(let x=0;x<14;x++)p.push((x*16)+','+(34-seed(i,k*7+x)*28).toFixed(1));
  return `<svg viewBox="0 0 208 38" preserveAspectRatio="none"><polyline fill="rgba(${col},.12)" points="0,38 ${p.join(' ')} 208,38"/><polyline fill="none" stroke="rgb(${col})" stroke-width="1.6" points="${p.join(' ')}"/></svg>`;}

function render(){
  const L=focus.type==='core'?CORE[focus.i]:EXT[focus.i], idx=L.idx;
  document.documentElement.style.setProperty('--ac',L.c);
  // 선택 기간 등락 반영 (노드/타일)
  nodes.forEach((nd,i)=>{const cl=CORE[i],rr=nd.querySelector('.r');rr.className='r '+sgn(pr(cl));rr.textContent=period+'일 '+fmt(pr(cl));});
  [...dock.children].forEach((t,i)=>{const xl=EXT[i],rr=t.querySelector('.rr');rr.className='rr '+sgn(pr(xl));rr.textContent=period+'일 '+fmt(pr(xl));
    t.classList.toggle('on',focus.type==='ext'&&focus.i===i);});
  if(focus.type==='ext')nodes.forEach(nd=>nd.classList.remove('sel'));

  // 중앙 허브 = 선택 계층 + 그 계층의 섹터들 (V6 원본 그대로)
  const hub=document.getElementById('hub');hub.style.setProperty('--ac',L.c);
  hub.innerHTML=`<div class="hnm" style="color:rgb(${L.c})">${L.num?L.num+' ':''}${L.n}</div>
    <div class="hmeta"><b class="${sgn(pr(L))}">${period}일 ${fmt(pr(L))}</b> · 비중 <b class="mono">${L.w}%</b></div>
    <div class="hsecs">${L.subs.map(s=>`<span class="hsec" title="${s[1]}">${s[0]}</span>`).join('')}</div>`;
}
function tick(){const c=document.getElementById('clock');if(c)c.textContent=new Date().toTimeString().slice(0,8)+' KST';}
tick();setInterval(tick,1000);window.addEventListener('resize',place);
place();render();
</script>
</body>
</html>
