<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>토큰 관리 가안 A</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
body{margin:0}
button{font-family:inherit}
</style>
</helmet>
<div style="width:390px;height:720px;box-sizing:border-box;background:#161618;padding:20px 20px 24px;display:flex;flex-direction:column;gap:14px;font-family:'Pretendard Variable',Pretendard,'Noto Sans KR',-apple-system,sans-serif;color:#d4d4d4;overflow:hidden">
  <div style="display:flex;align-items:center;gap:8px;height:44px">
    <button type="button" aria-label="뒤로" style="width:44px;height:44px;border:0;background:none;color:#d4d4d4;cursor:pointer;display:flex;align-items:center;justify-content:center;margin-left:-12px"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg></button>
    <div style="flex-grow:1;font-size:18px;font-weight:600;color:#ffffff">토큰 관리</div>
    <span style="font-size:11px;color:#85858a;background:rgba(255,255,255,.09);border-radius:999px;padding:4px 10px">예시 값 · 연결 전</span>
  </div>

  <div style="background:#1c1c1f;border-radius:28px;padding:20px 8px 8px">
    <div style="padding:0 12px;font-size:15px;font-weight:500;color:#9d9d9d">{{big.caption}}</div>
    <div style="display:flex;align-items:flex-end;gap:4px;padding:6px 12px 0;color:#ffffff;font-weight:700;letter-spacing:-.03em">
      <span style="font-size:26px;line-height:34px;font-variant-numeric:tabular-nums;{{big.numStyle}}">{{big.pct}}</span>
      <span style="font-size:18px;line-height:30px;margin-right:6px;{{big.numStyle}}">{{big.unit}}</span>
      <span style="font-size:13px;line-height:28px;font-weight:500;letter-spacing:0;color:#9d9d9d">{{big.who}}</span>
    </div>

    <div style="padding:14px 12px 0;display:flex;flex-direction:column;gap:12px">
      <div>
        <div style="display:flex;justify-content:space-between;font-size:11px;color:#85858a;padding:0 2px 6px"><span>5시간</span><span>{{big.r5}}</span></div>
        <div style="height:14px;border-radius:999px;background:rgba(255,255,255,.09);overflow:hidden"><div style="{{big.bar5}}"></div></div>
      </div>
      <div>
        <div style="display:flex;justify-content:space-between;font-size:11px;color:#85858a;padding:0 2px 6px"><span>주간</span><span>{{big.r7}}</span></div>
        <div style="height:14px;border-radius:999px;background:rgba(255,255,255,.09);overflow:hidden"><div style="{{big.bar7}}"></div></div>
      </div>
    </div>

    <div style="display:flex;flex-direction:column;padding-top:12px">
      <sc-for list="{{accounts}}" as="acc" hint-placeholder-count="5">
        <div style="{{acc.wrapStyle}}">
          <button type="button" aria-expanded="{{acc.open}}" onClick="{{acc.pick}}" style="display:flex;align-items:center;gap:10px;width:100%;height:44px;padding:0 12px;border:0;background:none;cursor:pointer;text-align:left;font-size:15px;font-weight:500;{{acc.nameColor}}">
            <span style="{{acc.dotStyle}}"></span>
            <span style="flex-grow:1">{{acc.name}}</span>
            <span style="font-size:13px;font-variant-numeric:tabular-nums;{{acc.pctColor}}">{{acc.pct5}}</span>
          </button>
          <div style="{{acc.panStyle}}">
            <div style="padding:2px 12px 12px 32px;display:flex;flex-direction:column;gap:6px;font-size:12px;color:#9d9d9d;line-height:1.5">
              <div>{{acc.l1}}</div>
              <div>{{acc.l2}}</div>
              <div style="display:flex;align-items:center;gap:6px"><span style="font-size:11px;color:#d4d4d4;background:rgba(255,255,255,.09);border-radius:999px;padding:2px 8px">{{acc.src}}</span><span style="font-size:11px;color:#85858a">{{acc.ago}}</span></div>
            </div>
          </div>
        </div>
      </sc-for>
    </div>
  </div>

  <div style="font-size:11px;color:#85858a;line-height:1.6;padding:0 6px">Claude는 Claude Code 상태줄로 자동 수집해요. 쓰지 않는 계정은 마지막 확인값에 초기화 시각을 더해 보여 줘요. Codex · Gemini는 확인 중이에요.</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":720}}'>
class Component extends DCLogic {
  state = { sel: 0 };
  renderVals() {
    const ease = 'cubic-bezier(.34,1.3,.64,1)';
    const A = [
      { name: 'Claude 개인', p5: 72, p7: 41, r5: '2시간 10분 뒤 초기화', r7: '3일 뒤 초기화', ago: '방금 확인', src: '자동 · Claude Code' },
      { name: 'Claude 회사', p5: 100, p7: 64, r5: '초기화 지남', r7: '5일 뒤 초기화', ago: '어제 확인', src: '자동 · 마지막 확인값' },
      { name: 'Claude [계정 3]', p5: 8, p7: 12, r5: '40분 뒤 초기화', r7: '2일 뒤 초기화', ago: '1시간 전 확인', src: '자동 · Claude Code' },
      { name: 'Codex', p5: 55, p7: 80, r5: '1시간 50분 뒤 초기화', r7: '4일 뒤 초기화', ago: '3시간 전 확인', src: '확인 필요' },
      { name: 'Gemini', p5: null, p7: null, r5: '—', r7: '—', ago: '값 없음', src: '직접 입력' },
    ];
    const low = (p) => p != null && p <= 15;
    const col = (p) => (p == null ? '#85858a' : low(p) ? '#ff6b6b' : '#569cd6');
    const bar = (p, c) => 'height:14px;border-radius:999px;background:' + c + ';width:' + (p == null ? 0 : p) + '%;transition:width .55s ' + ease + ',background .3s';
    const s = A[this.state.sel];
    const big = {
      caption: '남은 한도',
      pct: s.p5 == null ? '—' : String(s.p5), unit: s.p5 == null ? '' : '%', who: '5시간 · ' + s.name,
      numStyle: 'color:' + (low(s.p5) ? '#ff6b6b' : '#ffffff'),
      r5: s.r5, r7: s.r7,
      bar5: bar(s.p5, col(s.p5)),
      bar7: bar(s.p7, s.p7 == null ? '#85858a' : low(s.p7) ? '#ff6b6b' : '#9d9d9d'),
    };
    const accounts = A.map((a, i) => {
      const on = i === this.state.sel;
      return {
        name: a.name, open: on,
        pct5: a.p5 == null ? '—' : a.p5 + '%',
        pctColor: 'color:' + (low(a.p5) ? '#ff6b6b' : '#9d9d9d'),
        nameColor: 'color:' + (on ? '#ffffff' : '#d4d4d4'),
        dotStyle: 'width:10px;height:10px;border-radius:50%;flex:none;transition:transform .3s ' + ease + ',background .3s;transform:scale(' + (on ? 1.15 : 1) + ');background:' + (on ? '#569cd6' : '#85858a'),
        wrapStyle: 'border-radius:18px;transition:background .25s;background:' + (on ? 'rgba(255,255,255,.05)' : 'transparent'),
        panStyle: 'overflow:hidden;transition:max-height .4s ' + ease + ',opacity .25s;max-height:' + (on ? 110 : 0) + 'px;opacity:' + (on ? 1 : 0),
        l1: '5시간 남음 ' + (a.p5 == null ? '—' : a.p5 + '%') + ' · ' + a.r5,
        l2: '주간 남음 ' + (a.p7 == null ? '—' : a.p7 + '%') + ' · ' + a.r7,
        src: a.src, ago: a.ago,
        pick: () => this.setState({ sel: i }),
      };
    });
    return { big, accounts };
  }
}
</script>
</body>
</html>
