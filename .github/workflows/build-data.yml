name: Build data.json from Apps Script

"on":
  schedule:
    - cron: '*/10 * * * *'   # 10분마다 (UTC 기준)
  workflow_dispatch:           # 수동 트리거 가능

permissions:
  contents: write

concurrency:
  group: build-data
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Ensure data folder exists
        run: mkdir -p data

      - name: Fetch dumpAllToJson from Apps Script
        run: |
          set -e
          BACKEND_URL="https://script.google.com/macros/s/AKfycbzBCVv5txxprNM-1WxB1YZrawu4sjGernf5Y5AD10xYwqF-8XxsS7L6jLTthP8FT6wO/exec"
          echo "Calling dumpAllToJson..."
          # Apps Script는 가끔 첫 호출에 cold start. 최대 3회 재시도.
          for i in 1 2 3; do
            if curl -sSL --fail --max-time 90 \
              "${BACKEND_URL}?action=dumpAllToJson" \
              -o data/data.json.tmp; then
              echo "Fetch OK on attempt $i"
              break
            else
              echo "Attempt $i failed, retrying..."
              sleep 5
            fi
          done
          # 응답 검증 — ok:true 인지
          if ! grep -q '"ok":true' data/data.json.tmp; then
            echo "ERROR: Response does not contain ok:true"
            head -200 data/data.json.tmp
            exit 1
          fi
          # 통과하면 정식 파일로
          mv data/data.json.tmp data/data.json
          echo "Size: $(wc -c < data/data.json) bytes"
          echo "Timings: $(grep -o '"timings":{[^}]*}' data/data.json || echo 'none')"

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/data.json
          if git diff --staged --quiet; then
            echo "No changes to data.json"
          else
            git commit -m "chore: update data.json [auto]"
            git push
            echo "Pushed update"
          fi
