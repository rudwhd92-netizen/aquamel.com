<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AQUAMEL — V-Shape Scanner</title>
<link rel="manifest" href="./manifest.json">
<link rel="icon" href="./icon-192.png">
<style>
html, body { margin: 0; height: 100%; background: #0b0b0d; }
body { display: flex; justify-content: center; }
iframe { width: 430px; max-width: 100%; height: 100%; border: 0; border-left: 1px solid #222226; border-right: 1px solid #222226; background: #1e1e1e; display: block; }
</style>
<script>
// v6.32: PC 화면 없앰 — 넓은 화면에서는 앱(모바일 화면)을 가운데 폭 430px 틀에 띄움. 좁은 화면으로 열면 앱으로 바로.
(function () {
  // v6.90: 넓은 화면 2단이 켜져 있고(기본) 가로 · 폭 900 · 높이 600 이상이면 앱으로 바로 (틀 없이 2단)
  try {
    var wide = localStorage.getItem('aq_wide') !== '0' && window.matchMedia('(min-width: 900px) and (min-height: 600px) and (orientation: landscape)').matches;
    if (wide || !window.matchMedia('(min-width: 1025px)').matches) { location.replace('./' + location.search + location.hash); }
  } catch (e) {}
})();
</script>
</head>
<body>
<iframe id="app" title="AQUAMEL" allow="clipboard-read; clipboard-write; fullscreen"></iframe>
<script>
(function () {
  var f = document.getElementById('app');
  f.src = './index.html' + location.search + location.hash;
  try { f.addEventListener('load', function () { try { document.title = f.contentDocument.title || document.title; } catch (e) {} }); } catch (e) {}
})();
</script>
</body>
</html>
